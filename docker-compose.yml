services:
  postgres:
    image: postgres:17-alpine
    container_name: al-insaf-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: al_insaf_dev
    volumes:
      - al-insaf-postgres-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  al-insaf-postgres-data:
